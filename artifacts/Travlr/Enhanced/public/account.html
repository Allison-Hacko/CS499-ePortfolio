<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Account | Travlr Getaways</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:760px;margin:35px auto;padding:0 18px;color:#24313b;line-height:1.6}
    nav{margin-bottom:25px}nav a{margin-right:14px}
    .panel{border:1px solid #d5dfe5;border-radius:10px;padding:20px;margin:20px 0}
    label{display:block;margin-top:12px;font-weight:bold}
    input{box-sizing:border-box;width:100%;padding:11px;margin-top:5px;border:1px solid #aab7c0;border-radius:5px}
    button{margin-top:16px;padding:11px 18px;cursor:pointer;border:0;border-radius:5px;background:#07566b;color:white}
    .message{min-height:28px}a{color:#07566b}
  </style>
  <link rel="stylesheet" href="/stylesheets/getaway-pages.css">
</head>
<body class="gh-page gh-account-page">
  <h1>Travlr Getaways</h1>
  <nav>
    <a href="/travel">Browse trips</a>
    <a href="/itinerary.html">My Itinerary</a>
  </nav>

  <h2>Welcome, traveler!</h2>
  <p>Sign in to manage your reservations, or create an account to get started.</p>

  <section class="panel">
    <h2>Sign in</h2>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="login-message" class="message" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>Create an account</h2>
    <form id="register-form">
      <label for="register-name">Full name</label>
      <input id="register-name" type="text" autocomplete="name" maxlength="100" required>
      <label for="register-email">Email</label>
      <input id="register-email" type="email" autocomplete="email" required>
      <label for="register-password">Password (at least 8 characters)</label>
      <input id="register-password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Create account</button>
    </form>
    <p id="register-message" class="message" role="status" aria-live="polite"></p>
  </section>

  <script>
  async function submitAccount(endpoint, payload, messageElement) {
    messageElement.textContent = 'Please wait...';

    try {
      const response = await fetch('/api/' + endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await response.json();

      if (!response.ok) {
        messageElement.textContent = data.message || 'Unable to complete your request.';
        return;
      }

      if (!data.token) {
        messageElement.textContent = 'The server did not return a sign-in token.';
        return;
      }

      localStorage.setItem('travlr_token', data.token);
      if (data.user) {
        localStorage.setItem('travlr_user', JSON.stringify(data.user));
      }

      messageElement.textContent = 'Success! Opening your itinerary...';
      window.location.href = '/itinerary.html';
    } catch (error) {
      messageElement.textContent = 'Unable to reach the server. Please try again.';
    }
  }

  document.getElementById('login-form').addEventListener('submit', function (event) {
    event.preventDefault();
    submitAccount('login', {
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-password').value
    }, document.getElementById('login-message'));
  });

  document.getElementById('register-form').addEventListener('submit', function (event) {
    event.preventDefault();
    submitAccount('register', {
      name: document.getElementById('register-name').value.trim(),
      email: document.getElementById('register-email').value.trim(),
      password: document.getElementById('register-password').value
    }, document.getElementById('register-message'));
  });
  </script>
</body>
</html>
